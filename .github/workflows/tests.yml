name: tests
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU wheels)
        run: |
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]
      - name: CPU unit tests
        run: pytest tests --ignore=tests/gpu -q
      # The GPU checks (tests/gpu) need CUDA, local weights and a WorldTrack clip; run them by hand (README.md).
