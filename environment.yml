# One environment for everything: the corrector, scoring, and the five front ends (Depth Anything 3, AllTracker,
# VGGT-Omega, 4RC, CoWTracker).  Versions are the ones the published numbers were produced with (CUDA 12.8 wheels).
#   conda env create -f environment.yml && conda activate relift && pip install -e .
name: relift
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0
      - torchvision==0.26.0
      - numpy==2.2.5
      - opencv-python-headless==4.13.0.90
      - pillow==12.0.0
      - scipy==1.15.3
      - tqdm==4.67.1
      - pyyaml==6.0.3
      - matplotlib==3.8.4
      - huggingface_hub==1.30.0
      - safetensors==0.8.0
      - einops==0.8.1
      - imageio==2.37.2
      - omegaconf==2.3.0        # Depth Anything 3
      - transformers==5.16.1    # Depth Anything 3
      - trimesh==4.11.1         # imported by Depth Anything 3's API module
      - timm==1.0.29            # CoWTracker's ViT blocks
      - natsort==8.4.0          # 4RC's evaluation code
      - requests==2.34.2        # Depth Anything 3
      - addict==2.4.0           # Depth Anything 3
      - plyfile==1.1.5          # Depth Anything 3
      - pycolmap==4.2.0         # imported by Depth Anything 3's model module
      - evo==1.37.1             # imported by Depth Anything 3's model module
      - pytest
